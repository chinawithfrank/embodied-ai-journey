<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 813" role="img" aria-label="04 · 相机逐针接线"><title>04 · 相机逐针接线</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;fill:var(--foreground,#172a38)} .title{font-size:19px;font-weight:500}.small{font-size:13px}.box{fill:var(--card,#f1f5f8);stroke:var(--border,#b0bec9);stroke-width:1}.wire{fill:none;stroke:var(--info,#1975ab);stroke-width:1.6}.power{stroke:var(--destructive,#c24848)}.ground{stroke:var(--muted-foreground,#697980)}.port{fill:var(--info,#1975ab)}</style><text x="10" y="28" class="title" text-anchor="start">04 · 相机逐针接线</text><rect x="8" y="52" width="142" height="623" rx="8" class="box"/><rect x="230" y="52" width="142" height="623" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">ESP32-S3</text><text x="301" y="80" class="" text-anchor="middle">BY-OV2640-V1.5</text><text x="20" y="111" class="" text-anchor="start">3V3</text><text x="242" y="111" class="" text-anchor="start">3V3</text><path d="M150 106 H190.0 V106 H230" class="wire power"/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">GND</text><text x="242" y="145" class="" text-anchor="start">GND</text><path d="M150 140 H190.0 V140 H230" class="wire ground"/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">GPIO4</text><text x="242" y="179" class="" text-anchor="start">D0 / Y2</text><path d="M150 174 H190.0 V174 H230" class="wire "/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">GPIO5</text><text x="242" y="213" class="" text-anchor="start">D1 / Y3</text><path d="M150 208 H190.0 V208 H230" class="wire "/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">GPIO6</text><text x="242" y="247" class="" text-anchor="start">D2 / Y4</text><path d="M150 242 H190.0 V242 H230" class="wire "/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="20" y="281" class="" text-anchor="start">GPIO7</text><text x="242" y="281" class="" text-anchor="start">D3 / Y5</text><path d="M150 276 H190.0 V276 H230" class="wire "/><circle cx="150" cy="276" r="2.4" class="port"/><circle cx="230" cy="276" r="2.4" class="port"/><text x="20" y="315" class="" text-anchor="start">GPIO8</text><text x="242" y="315" class="" text-anchor="start">D4 / Y6</text><path d="M150 310 H190.0 V310 H230" class="wire "/><circle cx="150" cy="310" r="2.4" class="port"/><circle cx="230" cy="310" r="2.4" class="port"/><text x="20" y="349" class="" text-anchor="start">GPIO9</text><text x="242" y="349" class="" text-anchor="start">D5 / Y7</text><path d="M150 344 H190.0 V344 H230" class="wire "/><circle cx="150" cy="344" r="2.4" class="port"/><circle cx="230" cy="344" r="2.4" class="port"/><text x="20" y="383" class="" text-anchor="start">GPIO10</text><text x="242" y="383" class="" text-anchor="start">D6 / Y8</text><path d="M150 378 H190.0 V378 H230" class="wire "/><circle cx="150" cy="378" r="2.4" class="port"/><circle cx="230" cy="378" r="2.4" class="port"/><text x="20" y="417" class="" text-anchor="start">GPIO11</text><text x="242" y="417" class="" text-anchor="start">D7 / Y9</text><path d="M150 412 H190.0 V412 H230" class="wire "/><circle cx="150" cy="412" r="2.4" class="port"/><circle cx="230" cy="412" r="2.4" class="port"/><text x="20" y="451" class="" text-anchor="start">GPIO13</text><text x="242" y="451" class="" text-anchor="start">PCLK</text><path d="M150 446 H190.0 V446 H230" class="wire "/><circle cx="150" cy="446" r="2.4" class="port"/><circle cx="230" cy="446" r="2.4" class="port"/><text x="20" y="485" class="" text-anchor="start">GPIO16</text><text x="242" y="485" class="" text-anchor="start">VS / VSYNC</text><path d="M150 480 H190.0 V480 H230" class="wire "/><circle cx="150" cy="480" r="2.4" class="port"/><circle cx="230" cy="480" r="2.4" class="port"/><text x="20" y="519" class="" text-anchor="start">GPIO17</text><text x="242" y="519" class="" text-anchor="start">HREF</text><path d="M150 514 H190.0 V514 H230" class="wire "/><circle cx="150" cy="514" r="2.4" class="port"/><circle cx="230" cy="514" r="2.4" class="port"/><text x="20" y="553" class="" text-anchor="start">GPIO18</text><text x="242" y="553" class="" text-anchor="start">SIOD / SDA</text><path d="M150 548 H190.0 V548 H230" class="wire "/><circle cx="150" cy="548" r="2.4" class="port"/><circle cx="230" cy="548" r="2.4" class="port"/><text x="20" y="587" class="" text-anchor="start">GPIO21</text><text x="242" y="587" class="" text-anchor="start">SIOC / SCL</text><path d="M150 582 H190.0 V582 H230" class="wire "/><circle cx="150" cy="582" r="2.4" class="port"/><circle cx="230" cy="582" r="2.4" class="port"/><text x="20" y="621" class="" text-anchor="start">GPIO12</text><text x="242" y="621" class="" text-anchor="start">PWDN</text><path d="M150 616 H190.0 V616 H230" class="wire "/><circle cx="150" cy="616" r="2.4" class="port"/><circle cx="230" cy="616" r="2.4" class="port"/><text x="20" y="655" class="" text-anchor="start">GPIO14</text><text x="242" y="655" class="" text-anchor="start">RST / RESET</text><path d="M150 650 H190.0 V650 H230" class="wire "/><circle cx="150" cy="650" r="2.4" class="port"/><circle cx="230" cy="650" r="2.4" class="port"/><text x="10" y="702" class="small" text-anchor="start">相机为 3.3V 供电，不接 5V。</text><text x="10" y="727" class="small" text-anchor="start">24MHz 时钟由相机转接板提供。</text><text x="10" y="752" class="small" text-anchor="start">XCLK 不接 GPIO15；FLASH 不接。</text><text x="10" y="777" class="small" text-anchor="start">镜头排线保持配套安装；图像已校正倒装。</text></svg>