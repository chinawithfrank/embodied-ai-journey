<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 643" role="img" aria-label="01 · 电源分配与共地"><title>01 · 电源分配与共地</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;fill:var(--foreground,#172a38)} .title{font-size:19px;font-weight:500}.small{font-size:13px}.box{fill:var(--card,#f1f5f8);stroke:var(--border,#b0bec9);stroke-width:1}.wire{fill:none;stroke:var(--info,#1975ab);stroke-width:1.6}.power{stroke:var(--destructive,#c24848)}.ground{stroke:var(--muted-foreground,#697980)}.port{fill:var(--info,#1975ab)}</style><text x="10" y="28" class="title" text-anchor="start">01 · 电源分配与共地</text><rect x="8" y="52" width="142" height="453" rx="8" class="box"/><rect x="230" y="52" width="142" height="453" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">电源端</text><text x="301" y="80" class="" text-anchor="middle">负载端</text><text x="20" y="111" class="" text-anchor="start">USB 5V</text><text x="242" y="111" class="" text-anchor="start">ESP32 USB</text><path d="M150 106 H190.0 V106 H230" class="wire power"/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">电池正极</text><text x="242" y="145" class="" text-anchor="start">电池盒开关</text><path d="M150 140 H190.0 V140 H230" class="wire power"/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">开关输出</text><text x="242" y="179" class="" text-anchor="start">+BATT 分支</text><path d="M150 174 H190.0 V174 H230" class="wire power"/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">+BATT</text><text x="242" y="213" class="" text-anchor="start">DRV8833 VCC</text><path d="M150 208 H190.0 V208 H230" class="wire power"/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">+BATT</text><text x="242" y="247" class="" text-anchor="start">LR7843「+」</text><path d="M150 242 H190.0 V242 H230" class="wire power"/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="20" y="281" class="" text-anchor="start">+BATT</text><text x="242" y="281" class="" text-anchor="start">风扇红线</text><path d="M150 276 H190.0 V276 H230" class="wire power"/><circle cx="150" cy="276" r="2.4" class="port"/><circle cx="230" cy="276" r="2.4" class="port"/><text x="20" y="315" class="" text-anchor="start">电池负极</text><text x="242" y="315" class="" text-anchor="start">公共 GND</text><path d="M150 310 H190.0 V310 H230" class="wire ground"/><circle cx="150" cy="310" r="2.4" class="port"/><circle cx="230" cy="310" r="2.4" class="port"/><text x="20" y="349" class="" text-anchor="start">ESP32 GND</text><text x="242" y="349" class="" text-anchor="start">公共 GND</text><path d="M150 344 H190.0 V344 H230" class="wire ground"/><circle cx="150" cy="344" r="2.4" class="port"/><circle cx="230" cy="344" r="2.4" class="port"/><text x="20" y="383" class="" text-anchor="start">DRV8833 GND</text><text x="242" y="383" class="" text-anchor="start">公共 GND</text><path d="M150 378 H190.0 V378 H230" class="wire ground"/><circle cx="150" cy="378" r="2.4" class="port"/><circle cx="230" cy="378" r="2.4" class="port"/><text x="20" y="417" class="" text-anchor="start">LR7843「−」</text><text x="242" y="417" class="" text-anchor="start">公共 GND</text><path d="M150 412 H190.0 V412 H230" class="wire ground"/><circle cx="150" cy="412" r="2.4" class="port"/><circle cx="230" cy="412" r="2.4" class="port"/><text x="20" y="451" class="" text-anchor="start">LR 信号 GND</text><text x="242" y="451" class="" text-anchor="start">公共 GND</text><path d="M150 446 H190.0 V446 H230" class="wire ground"/><circle cx="150" cy="446" r="2.4" class="port"/><circle cx="230" cy="446" r="2.4" class="port"/><text x="20" y="485" class="" text-anchor="start">相机 GND</text><text x="242" y="485" class="" text-anchor="start">ESP32 GND</text><path d="M150 480 H190.0 V480 H230" class="wire ground"/><circle cx="150" cy="480" r="2.4" class="port"/><circle cx="230" cy="480" r="2.4" class="port"/><text x="10" y="532" class="small" text-anchor="start">+BATT = 三节干电池串联，标称 4.5V。</text><text x="10" y="557" class="small" text-anchor="start">同名 +BATT / GND 端子分别连在一起。</text><text x="10" y="582" class="small" text-anchor="start">电机与风扇回流直接接电池负极。</text><text x="10" y="607" class="small" text-anchor="start">ESP32 电池供电支路尚未确认，未画入。</text></svg>