<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 405" role="img" aria-label="03 · 风扇开关"><title>03 · 风扇开关</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;fill:var(--foreground,#172a38)} .title{font-size:19px;font-weight:500}.small{font-size:13px}.box{fill:var(--card,#f1f5f8);stroke:var(--border,#b0bec9);stroke-width:1}.wire{fill:none;stroke:var(--info,#1975ab);stroke-width:1.6}.power{stroke:var(--destructive,#c24848)}.ground{stroke:var(--muted-foreground,#697980)}.port{fill:var(--info,#1975ab)}</style><text x="10" y="28" class="title" text-anchor="start">03 · 风扇开关</text><rect x="8" y="52" width="142" height="215" rx="8" class="box"/><rect x="230" y="52" width="142" height="215" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">电源 / ESP32</text><text x="301" y="80" class="" text-anchor="middle">LR7843 模块</text><text x="20" y="111" class="" text-anchor="start">GPIO40</text><text x="242" y="111" class="" text-anchor="start">PWM</text><path d="M150 106 H190.0 V106 H230" class="wire "/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">ESP32 GND</text><text x="242" y="145" class="" text-anchor="start">信号 GND</text><path d="M150 140 H190.0 V140 H230" class="wire ground"/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">+BATT</text><text x="242" y="179" class="" text-anchor="start">「+」</text><path d="M150 174 H190.0 V174 H230" class="wire power"/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">电池负极</text><text x="242" y="213" class="" text-anchor="start">「−」</text><path d="M150 208 H190.0 V208 H230" class="wire ground"/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">风扇黑线</text><text x="242" y="247" class="" text-anchor="start">LOAD</text><path d="M150 242 H190.0 V242 H230" class="wire "/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="10" y="294" class="small" text-anchor="start">风扇红线 → +BATT（开关后电池正极）</text><text x="10" y="319" class="small" text-anchor="start">风扇黑线只接 LOAD，不直连电池负极。</text><text x="10" y="344" class="small" text-anchor="start">风扇：Delta AFB0405MA-A，5V / 0.10A。</text><text x="10" y="369" class="small" text-anchor="start">两线风扇无转速反馈，GPIO40 高电平开启。</text></svg>