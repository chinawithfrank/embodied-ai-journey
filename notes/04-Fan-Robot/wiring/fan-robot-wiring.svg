<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1630" viewBox="0 0 840 1630"><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;fill:var(--foreground,#172a38)} .title{font-size:19px;font-weight:500}.small{font-size:13px}.box{fill:var(--card,#f1f5f8);stroke:var(--border,#b0bec9);stroke-width:1}.wire{fill:none;stroke:var(--info,#1975ab);stroke-width:1.6}.power{stroke:var(--destructive,#c24848)}.ground{stroke:var(--muted-foreground,#697980)}.port{fill:var(--info,#1975ab)}</style><rect width="840" height="1630" fill="#ffffff"/><text x="30" y="32" class="title" text-anchor="start">桌面风扇机器人 · 当前已确认接线</text><text x="30" y="57" class="small" text-anchor="start">按信号名称接线；图中位置不代表排针的物理顺序。</text><g transform="translate(30,80)"><text x="10" y="28" class="title" text-anchor="start">01 · 电源分配与共地</text><rect x="8" y="52" width="142" height="453" rx="8" class="box"/><rect x="230" y="52" width="142" height="453" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">电源端</text><text x="301" y="80" class="" text-anchor="middle">负载端</text><text x="20" y="111" class="" text-anchor="start">USB 5V</text><text x="242" y="111" class="" text-anchor="start">ESP32 USB</text><path d="M150 106 H190.0 V106 H230" class="wire power"/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">电池正极</text><text x="242" y="145" class="" text-anchor="start">电池盒开关</text><path d="M150 140 H190.0 V140 H230" class="wire power"/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">开关输出</text><text x="242" y="179" class="" text-anchor="start">+BATT 分支</text><path d="M150 174 H190.0 V174 H230" class="wire power"/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">+BATT</text><text x="242" y="213" class="" text-anchor="start">DRV8833 VCC</text><path d="M150 208 H190.0 V208 H230" class="wire power"/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">+BATT</text><text x="242" y="247" class="" text-anchor="start">LR7843「+」</text><path d="M150 242 H190.0 V242 H230" class="wire power"/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="20" y="281" class="" text-anchor="start">+BATT</text><text x="242" y="281" class="" text-anchor="start">风扇红线</text><path d="M150 276 H190.0 V276 H230" class="wire power"/><circle cx="150" cy="276" r="2.4" class="port"/><circle cx="230" cy="276" r="2.4" class="port"/><text x="20" y="315" class="" text-anchor="start">电池负极</text><text x="242" y="315" class="" text-anchor="start">公共 GND</text><path d="M150 310 H190.0 V310 H230" class="wire ground"/><circle cx="150" cy="310" r="2.4" class="port"/><circle cx="230" cy="310" r="2.4" class="port"/><text x="20" y="349" class="" text-anchor="start">ESP32 GND</text><text x="242" y="349" class="" text-anchor="start">公共 GND</text><path d="M150 344 H190.0 V344 H230" class="wire ground"/><circle cx="150" cy="344" r="2.4" class="port"/><circle cx="230" cy="344" r="2.4" class="port"/><text x="20" y="383" class="" text-anchor="start">DRV8833 GND</text><text x="242" y="383" class="" text-anchor="start">公共 GND</text><path d="M150 378 H190.0 V378 H230" class="wire ground"/><circle cx="150" cy="378" r="2.4" class="port"/><circle cx="230" cy="378" r="2.4" class="port"/><text x="20" y="417" class="" text-anchor="start">LR7843「−」</text><text x="242" y="417" class="" text-anchor="start">公共 GND</text><path d="M150 412 H190.0 V412 H230" class="wire ground"/><circle cx="150" cy="412" r="2.4" class="port"/><circle cx="230" cy="412" r="2.4" class="port"/><text x="20" y="451" class="" text-anchor="start">LR 信号 GND</text><text x="242" y="451" class="" text-anchor="start">公共 GND</text><path d="M150 446 H190.0 V446 H230" class="wire ground"/><circle cx="150" cy="446" r="2.4" class="port"/><circle cx="230" cy="446" r="2.4" class="port"/><text x="20" y="485" class="" text-anchor="start">相机 GND</text><text x="242" y="485" class="" text-anchor="start">ESP32 GND</text><path d="M150 480 H190.0 V480 H230" class="wire ground"/><circle cx="150" cy="480" r="2.4" class="port"/><circle cx="230" cy="480" r="2.4" class="port"/><text x="10" y="532" class="small" text-anchor="start">+BATT = 三节干电池串联，标称 4.5V。</text><text x="10" y="557" class="small" text-anchor="start">同名 +BATT / GND 端子分别连在一起。</text><text x="10" y="582" class="small" text-anchor="start">电机与风扇回流直接接电池负极。</text><text x="10" y="607" class="small" text-anchor="start">ESP32 电池供电支路尚未确认，未画入。</text></g><g transform="translate(430,80)"><text x="10" y="28" class="title" text-anchor="start">02 · 履带控制</text><rect x="8" y="52" width="142" height="215" rx="8" class="box"/><rect x="230" y="52" width="142" height="215" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">ESP32-S3</text><text x="301" y="80" class="" text-anchor="middle">DRV8833</text><text x="20" y="111" class="" text-anchor="start">GPIO1</text><text x="242" y="111" class="" text-anchor="start">IN1</text><path d="M150 106 H190.0 V106 H230" class="wire "/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">GPIO2</text><text x="242" y="145" class="" text-anchor="start">IN2</text><path d="M150 140 H190.0 V140 H230" class="wire "/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">GPIO38</text><text x="242" y="179" class="" text-anchor="start">IN3</text><path d="M150 174 H190.0 V174 H230" class="wire "/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">GPIO39</text><text x="242" y="213" class="" text-anchor="start">IN4</text><path d="M150 208 H190.0 V208 H230" class="wire "/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">GND</text><text x="242" y="247" class="" text-anchor="start">GND</text><path d="M150 242 H190.0 V242 H230" class="wire ground"/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="10" y="294" class="small" text-anchor="start">OUT1 / OUT2 → 左履带 N20 两端</text><text x="10" y="319" class="small" text-anchor="start">OUT3 / OUT4 → 右履带 N20 两端</text><text x="10" y="344" class="small" text-anchor="start">每台电机跨接对应两个 OUT，不接 GND。</text><text x="10" y="369" class="small" text-anchor="start">J1 保持连接；EEP、ULT 不接 ESP32。</text></g><g transform="translate(30,747)"><text x="10" y="28" class="title" text-anchor="start">03 · 风扇开关</text><rect x="8" y="52" width="142" height="215" rx="8" class="box"/><rect x="230" y="52" width="142" height="215" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">电源 / ESP32</text><text x="301" y="80" class="" text-anchor="middle">LR7843 模块</text><text x="20" y="111" class="" text-anchor="start">GPIO40</text><text x="242" y="111" class="" text-anchor="start">PWM</text><path d="M150 106 H190.0 V106 H230" class="wire "/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">ESP32 GND</text><text x="242" y="145" class="" text-anchor="start">信号 GND</text><path d="M150 140 H190.0 V140 H230" class="wire ground"/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">+BATT</text><text x="242" y="179" class="" text-anchor="start">「+」</text><path d="M150 174 H190.0 V174 H230" class="wire power"/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">电池负极</text><text x="242" y="213" class="" text-anchor="start">「−」</text><path d="M150 208 H190.0 V208 H230" class="wire ground"/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">风扇黑线</text><text x="242" y="247" class="" text-anchor="start">LOAD</text><path d="M150 242 H190.0 V242 H230" class="wire "/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="10" y="294" class="small" text-anchor="start">风扇红线 → +BATT（开关后电池正极）</text><text x="10" y="319" class="small" text-anchor="start">风扇黑线只接 LOAD，不直连电池负极。</text><text x="10" y="344" class="small" text-anchor="start">风扇：Delta AFB0405MA-A，5V / 0.10A。</text><text x="10" y="369" class="small" text-anchor="start">两线风扇无转速反馈，GPIO40 高电平开启。</text></g><g transform="translate(430,747)"><text x="10" y="28" class="title" text-anchor="start">04 · 相机逐针接线</text><rect x="8" y="52" width="142" height="623" rx="8" class="box"/><rect x="230" y="52" width="142" height="623" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">ESP32-S3</text><text x="301" y="80" class="" text-anchor="middle">BY-OV2640-V1.5</text><text x="20" y="111" class="" text-anchor="start">3V3</text><text x="242" y="111" class="" text-anchor="start">3V3</text><path d="M150 106 H190.0 V106 H230" class="wire power"/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">GND</text><text x="242" y="145" class="" text-anchor="start">GND</text><path d="M150 140 H190.0 V140 H230" class="wire ground"/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">GPIO4</text><text x="242" y="179" class="" text-anchor="start">D0 / Y2</text><path d="M150 174 H190.0 V174 H230" class="wire "/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">GPIO5</text><text x="242" y="213" class="" text-anchor="start">D1 / Y3</text><path d="M150 208 H190.0 V208 H230" class="wire "/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">GPIO6</text><text x="242" y="247" class="" text-anchor="start">D2 / Y4</text><path d="M150 242 H190.0 V242 H230" class="wire "/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="20" y="281" class="" text-anchor="start">GPIO7</text><text x="242" y="281" class="" text-anchor="start">D3 / Y5</text><path d="M150 276 H190.0 V276 H230" class="wire "/><circle cx="150" cy="276" r="2.4" class="port"/><circle cx="230" cy="276" r="2.4" class="port"/><text x="20" y="315" class="" text-anchor="start">GPIO8</text><text x="242" y="315" class="" text-anchor="start">D4 / Y6</text><path d="M150 310 H190.0 V310 H230" class="wire "/><circle cx="150" cy="310" r="2.4" class="port"/><circle cx="230" cy="310" r="2.4" class="port"/><text x="20" y="349" class="" text-anchor="start">GPIO9</text><text x="242" y="349" class="" text-anchor="start">D5 / Y7</text><path d="M150 344 H190.0 V344 H230" class="wire "/><circle cx="150" cy="344" r="2.4" class="port"/><circle cx="230" cy="344" r="2.4" class="port"/><text x="20" y="383" class="" text-anchor="start">GPIO10</text><text x="242" y="383" class="" text-anchor="start">D6 / Y8</text><path d="M150 378 H190.0 V378 H230" class="wire "/><circle cx="150" cy="378" r="2.4" class="port"/><circle cx="230" cy="378" r="2.4" class="port"/><text x="20" y="417" class="" text-anchor="start">GPIO11</text><text x="242" y="417" class="" text-anchor="start">D7 / Y9</text><path d="M150 412 H190.0 V412 H230" class="wire "/><circle cx="150" cy="412" r="2.4" class="port"/><circle cx="230" cy="412" r="2.4" class="port"/><text x="20" y="451" class="" text-anchor="start">GPIO13</text><text x="242" y="451" class="" text-anchor="start">PCLK</text><path d="M150 446 H190.0 V446 H230" class="wire "/><circle cx="150" cy="446" r="2.4" class="port"/><circle cx="230" cy="446" r="2.4" class="port"/><text x="20" y="485" class="" text-anchor="start">GPIO16</text><text x="242" y="485" class="" text-anchor="start">VS / VSYNC</text><path d="M150 480 H190.0 V480 H230" class="wire "/><circle cx="150" cy="480" r="2.4" class="port"/><circle cx="230" cy="480" r="2.4" class="port"/><text x="20" y="519" class="" text-anchor="start">GPIO17</text><text x="242" y="519" class="" text-anchor="start">HREF</text><path d="M150 514 H190.0 V514 H230" class="wire "/><circle cx="150" cy="514" r="2.4" class="port"/><circle cx="230" cy="514" r="2.4" class="port"/><text x="20" y="553" class="" text-anchor="start">GPIO18</text><text x="242" y="553" class="" text-anchor="start">SIOD / SDA</text><path d="M150 548 H190.0 V548 H230" class="wire "/><circle cx="150" cy="548" r="2.4" class="port"/><circle cx="230" cy="548" r="2.4" class="port"/><text x="20" y="587" class="" text-anchor="start">GPIO21</text><text x="242" y="587" class="" text-anchor="start">SIOC / SCL</text><path d="M150 582 H190.0 V582 H230" class="wire "/><circle cx="150" cy="582" r="2.4" class="port"/><circle cx="230" cy="582" r="2.4" class="port"/><text x="20" y="621" class="" text-anchor="start">GPIO12</text><text x="242" y="621" class="" text-anchor="start">PWDN</text><path d="M150 616 H190.0 V616 H230" class="wire "/><circle cx="150" cy="616" r="2.4" class="port"/><circle cx="230" cy="616" r="2.4" class="port"/><text x="20" y="655" class="" text-anchor="start">GPIO14</text><text x="242" y="655" class="" text-anchor="start">RST / RESET</text><path d="M150 650 H190.0 V650 H230" class="wire "/><circle cx="150" cy="650" r="2.4" class="port"/><circle cx="230" cy="650" r="2.4" class="port"/><text x="10" y="702" class="small" text-anchor="start">相机为 3.3V 供电，不接 5V。</text><text x="10" y="727" class="small" text-anchor="start">24MHz 时钟由相机转接板提供。</text><text x="10" y="752" class="small" text-anchor="start">XCLK 不接 GPIO15；FLASH 不接。</text><text x="10" y="777" class="small" text-anchor="start">镜头排线保持配套安装；图像已校正倒装。</text></g><text x="30" y="1605" class="small" text-anchor="start">改线前拔 USB、关电池；刷写期间关电池。未纳入未经确认的稳压/电池供电改装。</text></svg>