<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 405" role="img" aria-label="02 · 履带控制"><title>02 · 履带控制</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;fill:var(--foreground,#172a38)} .title{font-size:19px;font-weight:500}.small{font-size:13px}.box{fill:var(--card,#f1f5f8);stroke:var(--border,#b0bec9);stroke-width:1}.wire{fill:none;stroke:var(--info,#1975ab);stroke-width:1.6}.power{stroke:var(--destructive,#c24848)}.ground{stroke:var(--muted-foreground,#697980)}.port{fill:var(--info,#1975ab)}</style><text x="10" y="28" class="title" text-anchor="start">02 · 履带控制</text><rect x="8" y="52" width="142" height="215" rx="8" class="box"/><rect x="230" y="52" width="142" height="215" rx="8" class="box"/><text x="79" y="80" class="" text-anchor="middle">ESP32-S3</text><text x="301" y="80" class="" text-anchor="middle">DRV8833</text><text x="20" y="111" class="" text-anchor="start">GPIO1</text><text x="242" y="111" class="" text-anchor="start">IN1</text><path d="M150 106 H190.0 V106 H230" class="wire "/><circle cx="150" cy="106" r="2.4" class="port"/><circle cx="230" cy="106" r="2.4" class="port"/><text x="20" y="145" class="" text-anchor="start">GPIO2</text><text x="242" y="145" class="" text-anchor="start">IN2</text><path d="M150 140 H190.0 V140 H230" class="wire "/><circle cx="150" cy="140" r="2.4" class="port"/><circle cx="230" cy="140" r="2.4" class="port"/><text x="20" y="179" class="" text-anchor="start">GPIO38</text><text x="242" y="179" class="" text-anchor="start">IN3</text><path d="M150 174 H190.0 V174 H230" class="wire "/><circle cx="150" cy="174" r="2.4" class="port"/><circle cx="230" cy="174" r="2.4" class="port"/><text x="20" y="213" class="" text-anchor="start">GPIO39</text><text x="242" y="213" class="" text-anchor="start">IN4</text><path d="M150 208 H190.0 V208 H230" class="wire "/><circle cx="150" cy="208" r="2.4" class="port"/><circle cx="230" cy="208" r="2.4" class="port"/><text x="20" y="247" class="" text-anchor="start">GND</text><text x="242" y="247" class="" text-anchor="start">GND</text><path d="M150 242 H190.0 V242 H230" class="wire ground"/><circle cx="150" cy="242" r="2.4" class="port"/><circle cx="230" cy="242" r="2.4" class="port"/><text x="10" y="294" class="small" text-anchor="start">OUT1 / OUT2 → 左履带 N20 两端</text><text x="10" y="319" class="small" text-anchor="start">OUT3 / OUT4 → 右履带 N20 两端</text><text x="10" y="344" class="small" text-anchor="start">每台电机跨接对应两个 OUT，不接 GND。</text><text x="10" y="369" class="small" text-anchor="start">J1 保持连接；EEP、ULT 不接 ESP32。</text></svg>